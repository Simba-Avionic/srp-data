# Sample workflow for building and deploying a mdBook site to GitHub Pages
#
# To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
#
name: Deploy mdBook site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.36
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl --proto '=https' --tlsv1.2 https://sh.rustup.rs -sSf -y | sh
          rustup update
          cargo install --version ${MDBOOK_VERSION} mdbook
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Validate interactive chart data
        run: |
          python3 scripts/charts/generate.py --check
          python3 -m unittest discover -s tests -v
      - name: Build with mdBook
        run: mdbook build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate chart interactions in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/chart-tests" playwright@1.63.0
          "$RUNNER_TEMP/chart-tests/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 8765 --directory book > "$RUNNER_TEMP/chart-server.log" 2>&1 &
          chart_server_pid=$!
          trap 'kill "$chart_server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/chart-tests/node_modules" node tests/charts-browser.cjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
